# Session 7.2b -- UI-Optimizer Integration (real-solver dispatch path).
#
# WHY THIS EXISTS: the frontend (Session 7.1) is a static, client-only page
# with no backend of its own -- it can't run PuLP/CBC. This workflow is the
# "real solver confirm" half of the hybrid architecture agreed this session:
# a UI control change (exposure %, stack mode, lock/exclude) gets dispatched
# here as a `repository_dispatch` event, runs the ACTUAL, already-validated
# `optimizer.py` (same file, same solver, same constraints as every other
# session's output -- no second implementation to drift out of sync), and
# writes its result to a REQUEST-SCOPED file rather than the canonical
# lineup_single_{site}_{slate_id}.csv / lineups_multi_{site}_{slate_id}.csv path
# (optimizer.py's `--request-id` flag, decision #27) -- so an interactive
# "try these settings" preview can never clobber the canonical output that
# live automation (refresh_data.yml) and other consumers read from.
#
# Fired by: cloudflare_worker/optimizer_api/optimizer_api.js's `dispatch`
# action, which itself is called by the frontend (Session 7.2c). NOT fired
# by any schedule -- purely on-demand, one run per UI request.
#
# Required repo configuration (already done in Session 5.2 for the same
# GH_DISPATCH_TOKEN secret -- nothing new to set up here beyond confirming
# it's still valid):
#   - Settings -> Secrets and variables -> Actions -> GH_DISPATCH_TOKEN
#     must already exist (Session 5.2's fine-grained PAT, "Contents: Read
#     and write" on this repo) -- this workflow does not need its own
#     secret, it just needs write access to commit its own output file,
#     which `permissions: contents: write` below (GITHUB_TOKEN, not the
#     PAT) already covers.

name: Run Optimizer (On-Demand)

on:
  repository_dispatch:
    types: [run_optimizer_request]

# Each dispatch is independent (a different request_id writes a different
# file) -- no reason to queue one behind another the way refresh_data.yml's
# near-lock dispatches must. Multiple UI requests can run in parallel.
concurrency:
  group: run-optimizer-${{ github.event.client_payload.request_id }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  run_optimizer:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required payload fields
        run: |
          if [ -z "${{ github.event.client_payload.request_id }}" ]; then
            echo "::error::client_payload.request_id is required -- refusing to run without a scoped output path (decision #27's whole point)."
            exit 1
          fi
          if [ -z "${{ github.event.client_payload.site }}" ] || [ -z "${{ github.event.client_payload.slate_id }}" ]; then
            echo "::error::client_payload.site and client_payload.slate_id are required."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Builds the optimizer.py CLI invocation from the dispatch payload.
      # Every field is OPTIONAL except site/slate_id/request_id (already
      # validated above) -- an omitted field means "use optimizer.py's own
      # default," never a value this workflow invents on its behalf. This
      # keeps the exact same "flag, don't silently assume" behavior the CLI
      # itself already has.
      - name: Build optimizer.py arguments
        id: build_args
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json, os, shlex

          p = json.loads(os.environ["PAYLOAD_JSON"])

          def flag(name, key, cast=str):
              v = params.get(key)
              if v in (None, "", []):
                  return []
              return [name, str(cast(v))]

          def bool_flag(name, key):
              return [name] if params.get(key) in (True, "true", "1", 1) else []

          # site/slate_id/request_id stay top-level in client_payload; every
          # optional field is nested under client_payload.params (Session
          # 7.2b hotfix -- see optimizer_api.js's own comment: GitHub's
          # repository_dispatch caps client_payload at 10 top-level
          # properties, hit for real via live testing when stacking+lock+
          # exclude were combined in one request).
          params = p.get("params", {})

          args = []
          args += ["--site", str(p["site"])]
          args += ["--slate-id", str(p["slate_id"])]
          args += ["--request-id", str(p["request_id"])]
          # WK3 postmortem §1 -- optional, defaults to "shared" in
          # optimizer.py if absent (old cached dispatches, manual curl).
          # Folded into the slate-keyed output filename below so concurrent
          # builds from different browsers don't overwrite each other's
          # lineups_multi_{site}_{slate_id}.csv.
          if p.get("client_id"):
              args += ["--client-id", str(p["client_id"])]

          # Session 13.5 -- Showdown/Single-Game wiring. Omitted means
          # optimizer.py's own "auto" default (detect from the loaded
          # final_projections file's slate_format column) -- same "omit
          # means the CLI's own default" convention as every other
          # optional field here. The frontend only ever sends "showdown"
          # explicitly (never "classic"), so this stays a no-op for every
          # classic build.
          args += flag("--format", "format")

          if params.get("mode") == "multi":
              args += flag("--n-lineups", "n_lineups", int)
          args += flag("--max-exposure", "max_exposure", float)
          args += flag("--uniqueness", "uniqueness", int)
          args += flag("--randomization-pct", "randomization_pct", float)
          args += flag("--seed", "seed", int)

          args += flag("--stack-mode", "stack_mode")
          args += flag("--stack-size", "stack_size", int)
          args += flag("--stack-positions", "stack_positions")
          args += bool_flag("--bring-back", "bring_back")
          args += flag("--stack-team", "stack_team")
          args += flag("--stack-game", "stack_game")
          args += flag("--game-stack-min-players", "game_stack_min_players", int)
          args += flag("--mini-stack-type", "mini_stack_type")
          args += flag("--stack-candidate-pool", "stack_candidate_pool", int)
          args += flag("--stack-diversify", "stack_diversify")

          args += flag("--lock", "lock")
          args += flag("--exclude", "exclude")

          # Classic-only hard "at least N of this pool" floor -- the pool
          # is the user's own explicit player_id selection, never an
          # auto-populated one, so this passes through unchanged as one
          # "ID,ID,ID:N" string (optimizer.py's parse_group_min_spec does
          # the actual parsing/validation).
          args += flag("--require-n-from-group", "require_n_from_group")

          args += flag("--min-salary-pct", "min_salary_pct", float)
          args += flag("--flex-positions", "flex_positions")

          # 2026-09-29 -- classic construction soft terms (--cl-*, classic
          # FC Lineup Study). Omit means optimizer.py's 0.0 default (off);
          # optimizer.py ignores them on Showdown pools.
          args += flag("--cl-dst-band-bonus", "cl_dst_band_bonus", float)
          args += flag("--cl-dst-expensive-penalty", "cl_dst_expensive_penalty", float)
          args += flag("--cl-zero-punt-penalty", "cl_zero_punt_penalty", float)
          args += flag("--cl-three-plus-punt-penalty", "cl_three_plus_punt_penalty", float)
          args += flag("--cl-flex-rb-bonus", "cl_flex_rb_bonus", float)
          args += flag("--cl-flex-wr-penalty", "cl_flex_wr_penalty", float)
          # 2026-10-05 -- price-tier pair was missing here and in the worker
          # allowlist, so UI builds never received it (ran at 0).
          args += flag("--cl-flex-wr-highprice-bonus", "cl_flex_wr_highprice_bonus", float)
          args += flag("--cl-flex-wr-midprice-penalty", "cl_flex_wr_midprice_penalty", float)
          # 2026-10-06 -- lineup-level replacement for the FLEX-WR pair (CLASSIC_RULES.md rule 3).
          args += flag("--cl-four-wr-no-stud-penalty", "cl_four_wr_no_stud_penalty", float)

          # Session 12 -- decisions #36-38. Same "omit means optimizer.py's
          # own default (no cap)" convention as every other optional field
          # above. Values arrive as comma-separated strings already built
          # by the frontend (e.g. "KC:2,DEN:1" / "KC-DEN:4"), passed through
          # unchanged -- optimizer.py's own parse_team_cap_list/
          # parse_game_cap_list do the actual parsing and validation.
          args += flag("--max-team-players", "max_team_players")
          args += flag("--max-game-players", "max_game_players")

          # Session 13.5 -- decision #47's Showdown-only one-sided-lineup
          # floor (the mirror of --max-team-players above, which applies to
          # both formats). Same "TEAM:N,TEAM:N" shape, passed through
          # unchanged -- optimizer.py's own parse_team_cap_list/
          # validate_min_team_players_feasibility do the actual parsing,
          # validation, and Showdown-only enforcement (a classic slate
          # sending this errors loudly there, not silently here).
          args += flag("--min-team-players", "min_team_players")

          # WK3 postmortem §2 parking-lot #2 (2026-09-29) -- Showdown
          # construction rules. Before this, UI builds never sent these, so
          # every UI Showdown lineup ran with zero rules (not even DST-can't-
          # be-CPT). The frontend always sends the showdown_se bundle (or
          # showdown_gpp if that preset is loaded) for Showdown pools and
          # never for classic. Values mirror data/optimizer_presets.json.
          args += bool_flag("--sd-require-cpt-qb", "sd_require_cpt_qb")
          args += flag("--sd-cheap-tier-penalty", "sd_cheap_tier_penalty", float)
          args += flag("--sd-cheap-tier-range", "sd_cheap_tier_range")
          args += flag("--sd-stack-cap", "sd_stack_cap", int)
          args += flag("--sd-stack-cap-penalty", "sd_stack_cap_penalty", float)
          args += flag("--sd-qb-partner-bonus", "sd_qb_partner_bonus", float)
          args += flag("--sd-exclude-cpt-positions", "sd_exclude_cpt_positions")
          args += flag("--sd-k-cpt-penalty", "sd_k_cpt_penalty", float)
          args += flag("--sd-heavy-side-cpt-penalty", "sd_heavy_side_cpt_penalty", float)

          # Session 16 -- decisions #48-55. Same "omit means optimizer.py's
          # own default (no override)" convention as every other optional
          # field above. --player-exposure arrives as a comma-separated
          # "PLAYER_ID:FRACTION" string already built by the frontend (same
          # shape as --max-team-players' "TEAM:N" above, but a 0.0-1.0
          # fraction, matching --max-exposure's own convention);
          # --thumbs-up/--thumbs-down are plain comma-separated player_id
          # lists, same shape as --lock/--exclude. optimizer.py's own
          # parse_player_exposure_list()/compute_thumbs_projection() do the
          # actual parsing and validation.
          args += flag("--player-exposure", "player_exposure")
          args += flag("--thumbs-up", "thumbs_up")
          args += flag("--thumbs-down", "thumbs_down")

          # Session 8 (this session) -- decisions #34/#35. Same "omit means
          # optimizer.py's own default (0, no floor)" convention as every
          # other optional field above.
          args += flag("--min-projection", "min_projection", float)
          args += flag("--min-total-ownership", "min_total_ownership", float)

          # Session 15 (Pre-Season Hardening) -- decision #A2. NOT built with
          # the shared flag() helper above, on purpose: flag() treats an
          # empty string the same as an absent key (both omit the CLI flag
          # entirely, falling back to optimizer.py's own default). That's
          # correct for every other field, whose off-state IS the CLI
          # default -- but this field's CLI default is ON
          # (DEFAULT_PARTICIPATION_FLOORS), so treating "user cleared the
          # box to turn it off" the same as "user never touched this
          # field" would silently keep the floor on when the user's whole
          # point was to disable it. index.html always sends this key
          # (never omits it, even when blank -- see its own comment), so
          # the distinction that matters here is present-with-empty-string
          # ("--participation-floors ''", explicit disable) vs. genuinely
          # absent from params (fall through to optimizer.py's default).
          if "participation_floors" in params:
              args += ["--participation-floors", str(params["participation_floors"])]

          # Session 17, decision #56 -- skill-vs-opposing-DST exclusion.
          # Boolean flag: present means "allow the combination" (lift the
          # default exclusion). Omitted means optimizer.py's own default
          # (exclusion ON) -- same bool_flag() convention as --bring-back
          # above.
          args += bool_flag("--allow-skill-vs-opp-dst", "allow_skill_vs_opp_dst")

          # Ad Hoc Session A3 -- mean-variance objective coefficient
          # (optimizer.py's --lambda, Session 10.5). Same "omit means
          # optimizer.py's own default (0.0, pure-mean)" convention as every
          # other optional field above.
          args += flag("--lambda", "lambda", float)

          # Ad Hoc Session A6 -- Dart Exposure Cap (optimizer.py's
          # --dart-exposure-cap/--dart-floor-threshold). Same "omit means
          # optimizer.py's own default (flag off / 1.0)" convention as
          # every other optional field above.
          args += flag("--dart-exposure-cap", "dart_exposure_cap", float)
          args += flag("--dart-floor-threshold", "dart_floor_threshold", float)

          print(f"args={shlex.join(args)}")
          PYEOF
        env:
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}

      - name: Run optimizer.py
        id: run
        continue-on-error: true
        # Redirected (not piped) to a log file so this step's own exit code
        # stays exactly optimizer.py's exit code (a pipe through `tee`
        # would need `pipefail` to preserve that correctly) -- the log is
        # then read by the next step to give the UI a REAL, specific error
        # instead of a generic one. Gap found via real live testing this
        # session: the original version of this step gave no way to tell
        # "slate has no final_projections file" apart from any other
        # failure without digging through the Actions log by hand.
        run: python3 scripts/optimizer.py ${{ steps.build_args.outputs.args }} > optimizer_run_output.log 2>&1

      # Redirecting to a file (above) means this step's own log would
      # otherwise show nothing -- print it back out here, always, so the
      # Actions UI keeps full visibility for manual debugging exactly like
      # before, on top of (not instead of) the request-scoped error.txt
      # below.
      - name: Show optimizer.py output
        if: always()
        run: cat optimizer_run_output.log

      # Failure path: optimizer.py raises loudly (bad lock request, infeasible
      # stack, missing final_projections file, etc.) -- capture ITS ACTUAL
      # error message (last lines of optimizer_run_output.log, which is
      # where Python's traceback and this project's own descriptive
      # exception messages land) into a request-scoped error file, so the
      # poller (optimizer_api.js) can tell the UI exactly why, instead of a
      # generic "check your params" message that sends the user hunting
      # through GitHub Actions logs for the real reason.
      - name: Write error marker on failure
        if: steps.run.outcome == 'failure'
        run: |
          mkdir -p output/ui_requests
          {
            echo "optimizer.py failed for this request. Last lines of its output:"
            echo ""
            tail -n 15 optimizer_run_output.log
          } > "output/ui_requests/${{ github.event.client_payload.request_id }}.error.txt"

      # Request-scoped files only -- deliberately narrower than
      # refresh_data.yml's `git add output/` (which is fine there since that
      # workflow owns the canonical files). This workflow must never commit
      # anything outside output/ui_requests/, with ONE deliberate,
      # explicit exception (Session 15, decision #B2): a classic multi-
      # lineup build also writes a slate-keyed copy,
      # output/lineups_multi_{site}_{slate_id}.csv (see optimizer.py's own
      # comment at that write site for why -- refresh_data.yml's pivot
      # gate and pivot_finder.py both need a deterministic, slate-keyed
      # filename to find, which the request_id-keyed file can never be).
      # Added by a per-slate glob, not one exact path, so this stays a
      # narrow, auditable exception rather than a reopened door -- `|| true`
      # because a Showdown or single-lineup build never produces this
      # file, and `git add` on a path that doesn't exist is a normal,
      # expected outcome here, not an error. WK3 postmortem §1 -- the glob
      # (not one fixed filename) is required because optimizer.py now
      # writes output/lineups_multi_{site}_{slate_id}_{client_id}.csv, a
      # different file per browser, so every dispatch must pick up its own
      # client's file regardless of client_id.
      - name: Commit request result
        if: always()
        run: |
          git config user.name "dfs-optimizer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/ui_requests/
          git add output/lineups_multi_"${{ github.event.client_payload.site }}"_"${{ github.event.client_payload.slate_id }}"_*.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No output produced (unexpected if optimizer.py succeeded) -- nothing to commit."
            exit 0
          fi
          git commit -m "On-demand optimizer run: ${{ github.event.client_payload.request_id }} [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}" || true
          # WK3 postmortem parking-lot fix (2026-09-28): concurrent
          # on-demand runs (same underlying cause as the lineup-file
          # overwrite race already fixed in §1) can both reach this step
          # at the same time -- the pull above picks up whichever commit
          # landed first, but a third run can still push in the gap
          # between that pull and this push, so a single unretried push
          # can fail ("cannot lock ref" / non-fast-forward) even though
          # optimizer.py already succeeded and the lineup file is sitting
          # right here uncommitted. Retry pull+push a few times with a
          # short randomized backoff before actually failing the run.
          attempt=1
          max_attempts=5
          until git push origin HEAD:"${{ github.ref_name }}"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "git push failed after $attempt attempts -- giving up." >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep "$(( (RANDOM % 5) + 2 ))"
            git pull --rebase origin "${{ github.ref_name }}" || true
          done

      - name: Fail the run if optimizer.py failed
        if: steps.run.outcome == 'failure'
        run: |
          echo "optimizer.py failed -- see the 'Run optimizer.py' step log above and output/ui_requests/${{ github.event.client_payload.request_id }}.error.txt"
          exit 1
