# WK4 postmortem item 4 (2026-10-05) built this; WK5 postmortem item 5
# (2026-10-12) made it the PERMANENT primary unattended injury-news
# mechanism, not a one-week Sunday workaround -- see X_INJURY_FEED_RUNBOOK.md
# and scripts/espn_diff_probe.py's own docstring for the full reasoning and
# the real-case review that motivated it.
#
# This is deliberately a SEPARATE, cheap workflow from refresh_data.yml, not
# a new mode inside it: it only pulls ESPN + diffs against the last
# committed status snapshot, and only escalates to the full pipeline when
# this tick's logic (computed INSIDE scripts/espn_diff_probe.py, not here
# and not on cron-job.org) calls for one.
#
# As of 2026-10-12, the script itself decides when it's worth doing any
# work at all -- it no-ops with zero network calls outside a pre-lock
# window (x_monitor_windows.compute_window(), 105 min before each lock
# through lock). That means cron-job.org no longer needs a per-week
# windowed schedule for this job: ONE job, "every 10 minutes, every day,
# all day," is both sufficient and cheap, since 95%+ of ticks outside a
# real window return instantly. See cloudflare_worker/scheduled_refresh.js's
# header for the exact one-time cron-job.org setup.
#
# Trigger: repository_dispatch type "scheduled_espn_diff_probe", relayed by
# cloudflare_worker/scheduled_refresh.js's `kind=espn_diff` -- same
# cron-job.org -> Worker -> repository_dispatch relay every other cadence
# in refresh_data.yml already uses (proven reliable; GitHub's native
# `schedule:` trigger was NOT -- see refresh_data.yml's header).
#
# workflow_dispatch is also enabled so this can be test-run manually before
# relying on it live.

name: ESPN Status Diff Probe

on:
  repository_dispatch:
    types: [scheduled_espn_diff_probe]
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional note for why this was triggered manually"
        required: false
        default: "manual test run"

# Separate concurrency group from refresh-data -- this job's own git commit
# (the freshly pulled status file) can safely queue behind or ahead of a
# refresh-data run; it doesn't need to block/be blocked by the heavier
# pipeline the way refresh-data's own matrix legs need to serialize against
# each other.
concurrency:
  group: espn-diff-probe
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # This job runs on a tight (5-10 min) cadence, unlike refresh_data.yml's
          # coarser jobs -- pip's own cache keeps each run's dependency install
          # down to a few seconds instead of a full cold install every tick,
          # which matters for the Actions-minutes budget item 6 is tracking.
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull ESPN status and diff against last committed snapshot
        id: diff
        run: python3 scripts/espn_diff_probe.py --dispatch-on-change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Commit the freshly pulled status file(s) regardless of whether a
      # change was detected -- harmless record, and gives the NEXT probe
      # tick an up-to-date baseline instead of diffing against an
      # increasingly stale one between real full refreshes.
      - name: Commit freshly pulled status snapshot
        if: always()
        run: |
          git config user.name "dfs-optimizer-bot"
          git config user.email "actions@users.noreply.github.com"
          git config core.autocrlf false
          git add output/player_status_*.csv logs/unmatched_status_*.csv
          if git diff --cached --quiet; then
            echo "No new status snapshot to commit."
            exit 0
          fi
          git commit -m "ESPN diff probe: status snapshot (changed=${{ steps.diff.outputs.changed }}) [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push origin HEAD:"${{ github.ref_name }}"

      - name: Summary
        if: always()
        run: |
          echo "changed output: ${{ steps.diff.outputs.changed }}"
          echo "If 'true', a near_lock_refresh dispatch was attempted (see the diff step's log for whether it succeeded) -- even if that dispatch failed, the committed status change above will still be picked up by the next scheduled full refresh."
