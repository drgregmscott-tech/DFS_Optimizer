# Session 5.2 -- Scheduling Infrastructure.
# Session 16.x -- REWORK: this workflow used to read exactly one DK entry and
# one FD entry from data/current_slate.json and run the per-slate steps
# (build projections, apply status, rebuild pivots) exactly twice per
# trigger. current_slate.json is now a list ("slates": [...]) with room for
# any number of active slates per site at once (main, early-only,
# afternoon-only, multiple showdowns on different games), so this workflow
# now has four jobs instead of one:
#   1. prepare      -- reads current_slate.json, drops any slate whose
#                       lock_time_utc has passed (+5 min buffer), and hands
#                       the remaining list to the other jobs.
#   2. shared_pull   -- Vegas lines and injury/active status are per REAL
#                       GAME, not per slate, so they're pulled ONCE per run
#                       (not once per active slate) and committed back to the
#                       repo. Every slate's projection build below reads
#                       from this same shared pull. If a pull fails, this
#                       job does NOT overwrite the existing committed file --
#                       every slate falls back to whatever Vegas/status data
#                       was last successfully pulled, and a warning is
#                       logged, rather than blocking every slate's refresh
#                       on one transient failure (explicit user call,
#                       Session 16.x).
#   3. refresh_slate -- runs once per entry still active after `prepare`
#                       (GitHub Actions matrix), rebuilding that one slate's
#                       projections, applying status, and rebuilding pivots.
#                       max-parallel: 1 -- these jobs each commit their own
#                       output back to the repo, and running them serially
#                       avoids two jobs' git commits racing each other
#                       (same reasoning the old single-job version already
#                       used for near-lock dispatches arriving close
#                       together).
#   4. finalize      -- rolls up shared_pull's and refresh_slate's results
#                       into one pass/fail for the whole run.
#
# IMPORTANT SCOPE NOTE (unchanged from Session 5.2 -- see SESSION_LOG.md for
# the full reasoning): this workflow does NOT run ingest_salaries.py,
# projections_baseline.py, or projections_matchup.py.
#   - ingest_salaries.py needs a manually-downloaded DK/FD export CSV --
#     neither site has a salary API, so this can never be automated. The
#     user downloads + ingests once when a slate posts, then adds an entry
#     to data/current_slate.json's "slates" list (committed) so this
#     workflow knows to start tracking it.
#   - projections_baseline.py / projections_matchup.py are computed once
#     from weeks-1..N-1 of weekly_stats -- they don't change intra-week the
#     way Vegas lines and injury status do, so re-running them on a 3-hour
#     or 15-minute cadence would just burn CI minutes for no new data.
#
# Three trigger cadences, unchanged from Session 5.2:
#   1. light_vegas_refresh (this file's own `schedule:` cron) -- Tue-Fri
#      1x/day, Sat 2x/day, Sun hourly from ~4hrs to ~1hr before a typical
#      1:00pm ET early-slate lock. Vegas-only, to stay inside The Odds
#      API's free-tier budget. NOTE: the Sunday hourly window is anchored
#      to a common 1:00pm ET early slate and is an approximation -- a week
#      with different lock times won't perfectly line up. Known limitation
#      of a static cron schedule, not a bug.
#   2. full_refresh_scheduled (this file's own `schedule:` cron) -- trimmed
#      2026-09-18 (see SESSION_LOG.md): the original "every 3 hours on
#      Thu/Sun/Mon" cadence was written in UTC without accounting for the
#      ET offset, so in real ET wall-clock time it actually fired from
#      Wed evening through Thu afternoon, Sat evening through Sun evening,
#      and Sun evening through Mon afternoon -- including 2am/5am ET runs
#      with no real news or line movement to catch, and each run fans out
#      into ~9 billed jobs (prepare + shared_pull + one refresh_slate job
#      per active slate + finalize) via the matrix in JOB 3 below. That
#      was consuming Actions minutes fast enough to threaten the
#      account-wide 2,000 min/month free-tier budget shared with every
#      other repo on the account. Replaced with 6 runs/week, anchored to
#      when data actually needs to be fresh:
#        - Thu 23:00 UTC (~7:00pm ET / 6:00pm CT) -- ~75min before a typical
#          8:15pm ET TNF lock; injury news drops ~90min before kickoff, so this
#          catches it with margin. (Moved from 23:15 on 2026-09-21 so the
#          player-props pull and rebuild finish comfortably before lock.)
#        - Sat 12:00 UTC (~8am ET) -- one early morning check.
#        - Sun 12:00, 16:00, 19:00 UTC (~8am, 12pm, 3pm ET) -- covers the
#          early slate, the midday window, and the afternoon slate.
#        - Mon 23:00 UTC (~7:00pm ET / 6:00pm CT) -- same logic as Thursday,
#          for MNF.
#      CAVEAT (same class of limitation already noted for the Sunday
#      vegas-only window below): these are fixed UTC times. Once DST ends
#      (Nov 2, 2026), they'll fire 1hr earlier in real ET wall-clock time
#      (e.g. 6:15pm instead of 7:15pm) unless revisited then.
#   3. full_refresh_dispatch (repository_dispatch, type "near_lock_refresh")
#      -- fired by cloudflare_worker/scheduled_refresh.js, itself pinged by
#      an external cron-job.org job during the real near-lock window(s).
#      With multiple slates now possible in one week, cron-job.org may need
#      more than one near-lock window configured (e.g. Thursday night AND
#      Sunday midday AND Sunday afternoon AND Sunday night AND Monday
#      night) -- that's a cron-job.org console setting, not a change to
#      this file. See Finding 2 / Session 16.x's cron-job.org notes.
#
# workflow_dispatch is also enabled for manual ad-hoc runs/testing.
#
# Required repo configuration (one-time, done in GitHub's UI, not in code,
# unchanged from Session 5.2):
#   - Settings -> Secrets and variables -> Actions -> New repository secret
#     ODDS_API_KEY = <your real Odds API key>
#   - Settings -> Actions -> General -> Workflow permissions -> set to
#     "Read and write permissions", so this workflow can commit its own
#     output/log files back to the repo.

name: Refresh Data

on:
  schedule:
    # --- light_vegas_refresh (vegas_odds.py only) ---
    - cron: "0 16 * * 2,3,4,5"        # Tue-Fri, 1x/day, ~noon ET
    - cron: "0 15,21 * * 6"           # Sat, 2x/day, ~11am + 5pm ET
    - cron: "0 15,16,17 * * 0"        # Sun, hourly, ~11am-1pm ET
    # --- full_refresh_scheduled (full pipeline, every active slate) ---
    # Trimmed 2026-09-18 from "every 3 hours on Thu/Sun/Mon" (24 runs/week,
    # including 2am/5am ET dead-of-night runs -- see header comment above)
    # down to 6 runs/week anchored to real lock/kickoff timing.
    - cron: "0 23 * * 4"              # Thu ~7:00pm ET / 6:00pm CT, ~75min before TNF lock (props pull runs here)
    - cron: "0 12 * * 6"              # Sat ~8am ET
    - cron: "0 12,16,19 * * 0"        # Sun ~8am/12pm/3pm ET
    - cron: "0 23 * * 1"              # Mon ~7:00pm ET / 6:00pm CT, ~75min before MNF lock (props pull runs here)
  repository_dispatch:
    types: [near_lock_refresh]
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional note for why this was triggered manually"
        required: false
        default: "manual test run"

# Session 16.x correction: this guard existed in the original single-job
# version of this workflow (Session 5.2) and was accidentally dropped
# during the multi-slate rework -- confirmed as a real, live gap when a
# scheduled run (#251) and a near-lock dispatch (#250) queued and began
# running at the same time during real testing, each one's jobs able to
# race the other's git commits on top of the CRLF/rebase issue fixed
# elsewhere in this file. Restored: overlapping runs now queue instead of
# running concurrently. cancel-in-progress: false, unchanged from the
# original reasoning -- a delayed refresh is better than a skipped one,
# especially for a near-lock dispatch.
concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------
  # JOB 1 -- read current_slate.json, drop anything already locked, and
  # hand the remaining active slates to the other jobs as JSON.
  # ---------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.trigger.outputs.mode }}
      trigger_type: ${{ steps.trigger.outputs.trigger_type }}
      matrix: ${{ steps.slates.outputs.matrix }}
      has_slates: ${{ steps.slates.outputs.has_slates }}
      season_week_pairs: ${{ steps.slates.outputs.season_week_pairs }}
      first_slate_id: ${{ steps.slates.outputs.first_slate_id }}
    steps:
      - name: Determine which cadence fired this run
        id: trigger
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 16 * * 2,3,4,5"|"0 15,21 * * 6"|"0 15,16,17 * * 0")
                echo "mode=vegas_only" >> "$GITHUB_OUTPUT"
                echo "trigger_type=light_vegas_refresh" >> "$GITHUB_OUTPUT"
                ;;
              "0 23 * * 4"|"0 12 * * 6"|"0 12,16,19 * * 0"|"0 23 * * 1")
                echo "mode=full" >> "$GITHUB_OUTPUT"
                echo "trigger_type=full_refresh_scheduled" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "mode=full" >> "$GITHUB_OUTPUT"
                echo "trigger_type=unknown_schedule_${{ github.event.schedule }}" >> "$GITHUB_OUTPUT"
                ;;
            esac
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "trigger_type=full_refresh_dispatch" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "trigger_type=manual_workflow_dispatch" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Read current_slate.json, drop locked slates
        id: slates
        run: |
          python3 -c "
          import json
          from datetime import datetime, timezone, timedelta

          LOCK_BUFFER = timedelta(minutes=5)
          now = datetime.now(timezone.utc)

          cfg = json.load(open('data/current_slate.json'))
          all_slates = cfg.get('slates', [])

          active = []
          for s in all_slates:
              lock_raw = s.get('lock_time_utc', '')
              try:
                  lock_dt = datetime.fromisoformat(lock_raw.replace('Z', '+00:00'))
                  locked = now >= (lock_dt + LOCK_BUFFER)
              except (ValueError, AttributeError):
                  locked = False
              if not locked:
                  active.append(s)

          print(f'::notice::{len(active)} of {len(all_slates)} slates active this run')
          for s in all_slates:
              if s not in active:
                  print(f\"::notice::skipping locked slate {s.get('slate_id')}\")

          matrix = {'include': active}
          pairs = sorted({(s['season'], s['week']) for s in active})
          pairs_json = json.dumps([{'season': p[0], 'week': p[1]} for p in pairs])

          with open('$GITHUB_OUTPUT', 'a') as f:
              f.write(f'matrix={json.dumps(matrix)}\n')
              f.write(f'has_slates={str(len(active) > 0).lower()}\n')
              f.write(f'season_week_pairs={pairs_json}\n')
              f.write(f'first_slate_id={active[0][\"slate_id\"] if active else \"\"}\n')
          "

  # ---------------------------------------------------------------------
  # JOB 2 -- Vegas lines and injury/active status are per real game, not
  # per slate: pulled once per run and shared by every active slate below.
  # ---------------------------------------------------------------------
  shared_pull:
    needs: prepare
    if: needs.prepare.outputs.has_slates == 'true'
    runs-on: ubuntu-latest
    outputs:
      # Session (this change) -- `continue-on-error: true` on the status
      # pull step below overrides the step's *conclusion* to "success" so
      # the job itself always reports success, but it does NOT touch
      # `outcome`, which still reflects what actually happened. Surfacing
      # `outcome` here is what lets `finalize` (JOB 4) tell a real pull
      # failure apart from a clean run -- see that job's comment for why
      # this was previously impossible.
      status_pull_outcome: ${{ steps.status_pull.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write API key from secret
        run: |
          mkdir -p config
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" > config/api_keys.env
          # Separate Odds API account/quota for player props (scripts/props_ingest.py
          # prefers this; an empty value falls back to ODDS_API_KEY).
          echo "ODDS_API_KEY_PROPS=${{ secrets.ODDS_API_KEY_PROPS }}" >> config/api_keys.env

      # Pulled once under the first active slate's slate_id -- Vegas lines
      # are site- and slate-agnostic, so every slate's build below points
      # back at this one pull via --vegas-slate-id. If this fails,
      # continue-on-error means the commit step below simply does not
      # overwrite the existing committed file -- every slate falls back to
      # the last successful pull automatically, no extra logic needed.
      - name: Pull fresh Vegas lines
        id: vegas
        continue-on-error: true
        run: python3 scripts/vegas_odds.py --slate-id ${{ needs.prepare.outputs.first_slate_id }}

      # Game-day weather forecast (scripts/weather.py, Open-Meteo, no key).
      # One pull per distinct season/week pair. Fail-safe by design: if this
      # fails, the previously committed data/weather_*.csv stays in place, and
      # if none exists the build treats every game as neutral (factor 1.0).
      - name: Pull game-day weather forecast
        id: weather
        continue-on-error: true
        env:
          SEASON_WEEK_PAIRS: ${{ needs.prepare.outputs.season_week_pairs }}
        run: |
          python3 -c "
          import json, os
          for p in json.loads(os.environ['SEASON_WEEK_PAIRS']):
              print(f\"{p['season']} {p['week']}\")
          " > /tmp/wx_pairs.txt
          while read season week; do
            python3 scripts/weather.py --season "$season" --week "$week"
          done < /tmp/wx_pairs.txt

      - name: Pull current-season team stats (needed by distributional DST)
        id: team_stats
        if: needs.prepare.outputs.mode == 'full'
        continue-on-error: true
        env:
          SEASON_WEEK_PAIRS: ${{ needs.prepare.outputs.season_week_pairs }}
        run: |
          python3 -c "
          import json, os
          pairs = json.loads(os.environ['SEASON_WEEK_PAIRS'])
          seasons = sorted({p['season'] for p in pairs})
          print(' '.join(str(s) for s in seasons))
          " > /tmp/seasons.txt
          python3 scripts/ingest_historical.py --season $(cat /tmp/seasons.txt)

      # Active slates can span more than one real (season, week) pair --
      # e.g. one slate still on Week 1's carryover sentinel while another
      # is a genuine Week 2+ slate. Status is pulled once per distinct
      # pair present, not once per slate.
      # Session (this change) -- previously this step's own shell loop
      # swallowed every pull failure a second time via `|| echo
      # "::warning::..."`, on top of the step-level `continue-on-error:
      # true` below. That double swallow is what let the injury/status
      # pull silently stop working for days (a real incident: a player
      # ruled OUT never got zeroed because no fresh status had actually
      # been pulled, while every run still reported "success"). The loop
      # now tracks failures and exits nonzero so `steps.status_pull.outcome`
      # correctly reports "failure" for `finalize` to see -- `continue-on-
      # error: true` is kept at the step level so one bad ESPN fetch for
      # one season/week pair still doesn't block the rest of this job.
      - name: Pull fresh injury/active status (once per distinct season/week)
        id: status_pull
        if: needs.prepare.outputs.mode == 'full'
        continue-on-error: true
        env:
          SEASON_WEEK_PAIRS: ${{ needs.prepare.outputs.season_week_pairs }}
        run: |
          python3 -c "
          import json, os
          pairs = json.loads(os.environ['SEASON_WEEK_PAIRS'])
          for p in pairs:
              print(f\"{p['season']} {p['week']}\")
          " > /tmp/pairs.txt
          FAILED=0
          while read season week; do
            echo "Pulling status for season=$season week=$week"
            if ! python3 scripts/status_check.py pull --season "$season" --week "$week"; then
              echo "::error::status pull failed for season=$season week=$week, matrix jobs will use last-known-good"
              FAILED=1
            fi
          done < /tmp/pairs.txt
          if [ \"$FAILED\" -eq 1 ]; then
            exit 1
          fi

      # Player-prop lines (scripts/props_auto.py; WK2_POSTMORTEM.md). Runs only
      # in full mode. For every slate that locks within ~100 minutes and has no
      # snapshot from the last 2 hours it pulls that slate's games ONCE (games
      # shared by several slates are bought once) and writes
      # data/props/props_{slate_id}.csv, which the projection builds below pick
      # up automatically. Each slate is due only near ITS OWN lock, so a
      # Thursday-night showdown, Sunday's classic slates, and the Sunday/Monday
      # night showdowns are pulled at different runs. Fail-safe by design:
      # exits 0 on any problem (builds then use the last snapshot if <72h old,
      # else engine only); committed by the step below along with data/.
      - name: Pull player props for slates near lock
        id: props
        if: needs.prepare.outputs.mode == 'full'
        continue-on-error: true
        run: python3 scripts/props_auto.py

      # Commit whatever was successfully refreshed. A failed pull above
      # simply produced no new file, so there is nothing new to commit for
      # that piece -- the previously-committed file remains in place as
      # the last-known-good version every matrix job below will read.
      - name: Commit shared refreshed data
        if: always()
        run: |
          git config user.name "dfs-optimizer-bot"
          git config user.email "actions@users.noreply.github.com"
          # Session 16.x fix -- without this, Git's own line-ending
          # renormalization (CRLF vs LF) can make the working tree look
          # "dirty" again immediately after a clean commit, which then
          # makes `git pull --rebase` refuse to proceed with "you have
          # unstaged changes" even though nothing was actually left
          # uncommitted on purpose. Turning renormalization off removes
          # the phantom diff at its source.
          git config core.autocrlf false
          git add data/ output/
          if git diff --cached --quiet; then
            echo "No shared data changes to commit."
            exit 0
          fi
          git commit -m "Shared Vegas/status/team-stats refresh (${{ needs.prepare.outputs.trigger_type }}) [skip ci]"
          # --autostash is a second, independent safety net: if anything
          # else is sitting uncommitted in the working tree for any other
          # reason, it gets stashed before the rebase and restored after,
          # instead of blocking the rebase outright.
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push origin HEAD:"${{ github.ref_name }}"

  # ---------------------------------------------------------------------
  # JOB 3 -- one pass per active slate: rebuild projections, apply status,
  # rebuild pivots. Runs once per entry prepare left in the matrix.
  # ---------------------------------------------------------------------
  refresh_slate:
    needs: [prepare, shared_pull]
    if: needs.prepare.outputs.has_slates == 'true'
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
      max-parallel: 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Check out the branch HEAD, not the SHA that triggered the run --
          # shared_pull commits the fresh status/Vegas pull AFTER that SHA,
          # so a SHA-pinned checkout applied a stale player_status file.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write API key from secret
        run: |
          mkdir -p config
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" > config/api_keys.env

      - name: Locate this slate's latest status pull file
        id: status_file
        if: needs.prepare.outputs.mode == 'full'
        run: |
          # Newest by the timestamp in the FILENAME, not mtime: a fresh git
          # checkout gives every file the same mtime, so `ls -t` picked an
          # arbitrary (often stale) status file per slate (2026-09-20).
          f=$(ls output/player_status_${{ matrix.week }}_*.csv 2>/dev/null | sort | tail -n 1 || true)
          echo "path=$f" >> "$GITHUB_OUTPUT"

      # Session 14.0 engine, --volume-prior and --sigma-recalibration are
      # opt-in and MUST be passed explicitly (unchanged from Session 5.2 /
      # 14.0). --vegas-slate-id always points at shared_pull's single
      # Vegas pull (first_slate_id), not this slate's own id -- Vegas
      # lines are slate-agnostic, matching the pre-rework behavior.
      - name: Rebuild projections
        id: build_proj
        continue-on-error: true
        run: |
          python3 scripts/build_projections_statline.py --site ${{ matrix.site }} \
            --season ${{ matrix.season }} \
            --week ${{ matrix.week }} \
            --slate-id ${{ matrix.slate_id }} \
            --vegas-slate-id ${{ needs.prepare.outputs.first_slate_id }} \
            --volume-prior --sigma-recalibration --dst-model distributional

      - name: Apply status (zero OUT players)
        id: apply_status
        if: needs.prepare.outputs.mode == 'full' && steps.status_file.outputs.path != ''
        continue-on-error: true
        run: |
          python3 scripts/status_check.py apply --site ${{ matrix.site }} \
            --week ${{ matrix.week }} \
            --status-file "${{ steps.status_file.outputs.path }}" \
            --projections-file "output/final_projections_${{ matrix.site }}_${{ matrix.slate_id }}.csv"

      # Session 15 decision #B1 (unchanged): checks lineups_multi first,
      # falls back to lineup_single. Missing lineup file is a normal
      # not_run outcome, not a failure -- nothing to pivot on yet.
      - name: Locate built lineup
        id: lineup
        if: needs.prepare.outputs.mode == 'full'
        run: |
          f=$(ls output/lineups_multi_${{ matrix.site }}_${{ matrix.slate_id }}.csv 2>/dev/null || true)
          if [ -z "$f" ]; then
            f=$(ls output/lineup_single_${{ matrix.site }}_${{ matrix.slate_id }}.csv 2>/dev/null || true)
          fi
          echo "path=$f" >> "$GITHUB_OUTPUT"

      - name: Rebuild pivot suggestions
        id: pivot
        if: needs.prepare.outputs.mode == 'full' && steps.lineup.outputs.path != ''
        continue-on-error: true
        run: python3 scripts/pivot_finder.py --site ${{ matrix.site }} --slate-id ${{ matrix.slate_id }}

      - name: Append run-log row
        if: always()
        run: |
          python3 -c "
          import csv, os
          from datetime import datetime, timezone
          from pathlib import Path

          log_path = Path('logs/automation_run_log.csv')
          fieldnames = ['timestamp_utc', 'trigger_type', 'site', 'slate_id', 'step', 'status']
          is_new = not log_path.exists()
          log_path.parent.mkdir(parents=True, exist_ok=True)

          now = datetime.now(timezone.utc).isoformat()
          trigger_type = '${{ needs.prepare.outputs.trigger_type }}'
          site = '${{ matrix.site }}'
          slate_id = '${{ matrix.slate_id }}'
          mode = '${{ needs.prepare.outputs.mode }}'

          def outcome(step_id):
              return os.environ.get(step_id, 'not_run')

          rows = []
          if mode == 'full':
              rows.append({'timestamp_utc': now, 'trigger_type': trigger_type, 'site': site, 'slate_id': slate_id, 'step': 'build_projections', 'status': outcome('BUILD_OUTCOME')})
              rows.append({'timestamp_utc': now, 'trigger_type': trigger_type, 'site': site, 'slate_id': slate_id, 'step': 'status_apply', 'status': outcome('APPLY_OUTCOME')})
              rows.append({'timestamp_utc': now, 'trigger_type': trigger_type, 'site': site, 'slate_id': slate_id, 'step': 'pivot_finder', 'status': outcome('PIVOT_OUTCOME')})

          with log_path.open('a', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames)
              if is_new:
                  writer.writeheader()
              writer.writerows(rows)

          print(f'Appended {len(rows)} row(s) to {log_path}')
          "
        env:
          BUILD_OUTCOME: ${{ steps.build_proj.outcome }}
          APPLY_OUTCOME: ${{ steps.apply_status.outcome }}
          PIVOT_OUTCOME: ${{ steps.pivot.outcome }}

      # max-parallel: 1 above means these matrix legs never run AT THE SAME
      # TIME, but each one still starts from its own fresh checkout, and a
      # prior leg's commit (or shared_pull's) may have already landed on
      # the remote branch by the time this leg is ready to push -- so a
      # rebase here is still genuinely needed, just never a true
      # simultaneous race. Session 16.x correction: an earlier version of
      # this comment claimed no rebase conflict was possible here at all,
      # which real testing (Session 16.x's six-slate live run) disproved --
      # every one of six legs needed and got a real rebase against a
      # commit that had landed since its own checkout.
      - name: Commit this slate's refreshed outputs + run log
        if: always()
        run: |
          git config user.name "dfs-optimizer-bot"
          git config user.email "actions@users.noreply.github.com"
          # Session 16.x fix -- same root cause and same fix as
          # shared_pull's commit step above: without this, line-ending
          # renormalization can make the working tree look dirty again
          # right after a clean commit, which then makes `git pull
          # --rebase` refuse to proceed with "you have unstaged changes"
          # even though nothing was genuinely left uncommitted. Confirmed
          # live: this exact failure hit all six matrix legs in Session
          # 16.x's real six-slate test run before this fix was added.
          git config core.autocrlf false
          git add output/ logs/automation_run_log.csv
          if git diff --cached --quiet; then
            echo "No changes to commit for ${{ matrix.slate_id }}."
            exit 0
          fi
          git commit -m "Automated refresh: ${{ matrix.slate_id }} (${{ needs.prepare.outputs.trigger_type }}) [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}" || true
          git push origin HEAD:"${{ github.ref_name }}"

  # ---------------------------------------------------------------------
  # JOB 4 -- fail the whole workflow run if the shared pull or any slate's
  # refresh actually failed, so a real problem still shows up red in the
  # Actions tab instead of being swallowed by continue-on-error everywhere.
  #
  # Session (this change) -- `needs.shared_pull.result` / `needs.
  # refresh_slate.result` are USELESS for this: every meaningful step in
  # both jobs runs under `continue-on-error: true`, which overrides the
  # step's *conclusion* to "success" and therefore the whole job's result
  # to "success" regardless of what actually happened inside. That's the
  # exact reason the injury-pull outage went undetected for days. This job
  # now checks the real per-step `outcome` values instead: shared_pull's
  # `status_pull_outcome` output (see that job), and refresh_slate's
  # per-leg outcomes as already recorded in logs/automation_run_log.csv
  # (matrix jobs don't expose per-leg outputs, but every leg appends a row
  # there regardless of outcome -- see "Append run-log row").
  # ---------------------------------------------------------------------
  finalize:
    needs: [prepare, shared_pull, refresh_slate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Branch HEAD so the run-log rows the matrix legs just committed
          # are visible to the failure cross-check below.
          ref: ${{ github.ref_name }}

      - name: Check for failures
        run: |
          FAIL=0

          if [ "${{ needs.shared_pull.outputs.status_pull_outcome }}" = "failure" ]; then
            echo "::error::shared_pull's injury/active status pull failed for at least one season/week pair -- status data may be stale. See the 'Pull fresh injury/active status' step logs above."
            FAIL=1
          fi

          if [ "${{ needs.shared_pull.result }}" = "failure" ] || [ "${{ needs.refresh_slate.result }}" = "failure" ]; then
            echo "::error::shared_pull or refresh_slate reported a hard job failure -- see the job logs above."
            FAIL=1
          fi

          # Cross-check the committed run log for any build/apply failure
          # logged by this run. The log is append-only and shared across
          # runs, so this only looks at rows from roughly this run's own
          # window rather than trying to scope by a run id the log doesn't
          # carry.
          if [ -f logs/automation_run_log.csv ]; then
            python3 -c "
          import csv, sys
          from datetime import datetime, timezone, timedelta

          cutoff = datetime.now(timezone.utc) - timedelta(hours=2)
          bad = []
          with open('logs/automation_run_log.csv', newline='') as f:
              for row in csv.DictReader(f):
                  try:
                      ts = datetime.fromisoformat(row['timestamp_utc'])
                  except ValueError:
                      continue
                  if ts >= cutoff and row['step'] in ('build_projections', 'status_apply') and row['status'] == 'failure':
                      bad.append(row)
          if bad:
              for r in bad:
                  print(f\"::error::{r['step']} failed for {r['site']} {r['slate_id']} ({r['trigger_type']})\")
              sys.exit(1)
          " || FAIL=1
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo "One or more real failures detected -- see errors above and logs/automation_run_log.csv."
            exit 1
          fi
          echo "No real failures detected."
          echo "All jobs completed (some individual steps may have used continue-on-error and fallen back to last-known-good -- check logs/automation_run_log.csv for per-slate detail)."
